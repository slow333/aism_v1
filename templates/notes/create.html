{% extends 'base/base.html' %}
{% load static %}
{% block title %} Create note {% endblock %}

{% block content %}
{% include 'notes/_nav.html' %}
<div class="flex-between mb-2">
    <h1 class="fw-bold text-white">+ Create note</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-12">
        <div class="card border-0 shadow-sm glass-card mb-4">
            <div class="card-body p-5">
                <h4 class="card-title fw-bold mb-4 text-secondary">Note 생성</h4>
                
                <form action="{% url 'notes:note-create' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="flex-end gap-2 mt-5">
                        <a href="{% url 'notes:notes-list' %}" class="btn btn-glass-secondary rounded-pill px-4">
                            ⨉ Cancel
                        </a>
                        <button type="submit" class="btn btn-glass-primary rounded-pill px-4">✓ Create note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
