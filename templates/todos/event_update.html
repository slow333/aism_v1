{% extends 'base/base.html' %}
{% block title %} Update Event - {{ event.title }} {% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-1">
    <h1 class="fw-bold text-primary">✍🏻 Update Event</h1>
</div>

{% include 'todos/_nav.html' %}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm glass-card mb-4">
            <div class="card-body p-5">
                <h4 class="card-title fw-bold mb-4 text-secondary">Edit Event Details</h4>
                
                <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-end gap-2 mt-5">
                        <a href="{% url 'todos:event-detail' event.id %}" class="btn btn-glass-secondary rounded-pill px-4">❌ Cancel</a>
                        <button type="submit" class="btn btn-glass-primary rounded-pill px-4">✔️ Update Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
